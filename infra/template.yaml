
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: DeployBox - 60 percent GitHub static deployments and deployment history

Globals:
  Function:
    Runtime: python3.13
    Timeout: 60
    MemorySize: 512

Resources:

  DeployBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub deploybox-assets-${AWS::AccountId}

      VersioningConfiguration:
        Status: Enabled

      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  DeployBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DeployBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${DeployBucket.Arn}/*'

  DashboardBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub deploybox-dashboard-${AWS::AccountId}

  DeploymentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: deploybox-deployments
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: deploymentId
          AttributeType: S

      KeySchema:
        - AttributeName: deploymentId
          KeyType: HASH

  NotifyTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: deploybox-notifications

  WebhookHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/webhook_handler/
      Handler: app.lambda_handler

      Environment:
        Variables:
          TABLE_NAME: !Ref DeploymentTable
          DEPLOY_ENGINE_FUNCTION: !Ref DeployEngineFunction

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DeploymentTable

        - LambdaInvokePolicy:
            FunctionName: !Ref DeployEngineFunction

      Events:
        Webhook:
          Type: Api
          Properties:
            Path: /webhook
            Method: post

  DeployEngineFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/deploy_engine/
      Handler: app.lambda_handler
      Timeout: 120

      Environment:
        Variables:
          TABLE_NAME: !Ref DeploymentTable
          DEPLOY_BUCKET: !Ref DeployBucket

      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DeployBucket

        - DynamoDBCrudPolicy:
            TableName: !Ref DeploymentTable

        - SNSPublishMessagePolicy:
            TopicName: !GetAtt NotifyTopic.TopicName

  ListDeploymentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/list_deployments/
      Handler: app.lambda_handler

      Environment:
        Variables:
          TABLE_NAME: !Ref DeploymentTable

      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DeploymentTable

      Events:
        History:
          Type: Api
          Properties:
            Path: /deployments
            Method: get

  NotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/notifier/
      Handler: app.lambda_handler

      Environment:
        Variables:
          SNS_TOPIC: !Ref NotifyTopic

      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt NotifyTopic.TopicName

Outputs:

  ApiEndpoint:
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/webhook'

  DeploymentsEndpoint:
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/deployments'

  DeployBucketName:
    Value: !Ref DeployBucket

  WebsiteURL:
    Value: !Sub 'http://${DeployBucket}.s3-website-${AWS::Region}.amazonaws.com'
