AWSTemplateFormatVersion: '2010-09-09'
Transform: 【entity-AWS¦canonical_name=AWS】::Serverless-2016-10-31
Description: DeployBox - Serverless Static Deployment Platform (40% - Object Storage Live)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 512
    Environment:
      Variables:
        DEPLOY_BUCKET: !Ref DeployBucket
        TABLE_NAME: !Ref DeploymentTable
        SNS_TOPIC: !Ref NotifyTopic
        LOG_TABLE: !Ref DeploymentTable

Resources:
  DeployBucket:
    Type: 【entity-AWS¦canonical_name=AWS】::S3::Bucket
    Properties:
      BucketName: !Sub deploybox-assets-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicReadPolicy: false

  DeployBucketPolicy:
    Type: 【entity-AWS¦canonical_name=AWS】::S3::BucketPolicy
    Properties:
      Bucket: !Ref DeployBucket
      PolicyDocument:
        Statement:
                    - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub ${DeployBucket.Arn}/*
            Condition:
              StringLike:
                s3:prefix: ["*"]

  DashboardBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub deploybox-dashboard-${AWS::AccountId}

  DeploymentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: deploybox-deployments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
                - AttributeName: deploymentId
          AttributeType: S
      KeySchema:
                - AttributeName: deploymentId
          KeyType: HASH

  NotifyTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: deploybox-notifications

  WebhookHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/webhook_handler/
      Handler: app.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref DeploymentTable
          DEPLOY_ENGINE_FUNCTION: !Ref DeployEngineFunction
      Events:
        Api:
          Type: Api
          Properties:
            Path: /webhook
            Method: post
      Policies:
                - DynamoDBCrudPolicy:
            TableName: !Ref DeploymentTable
                - LambdaInvokePolicy:
            FunctionName: !Ref DeployEngineFunction
                - S3WritePolicy:
            BucketName: !Ref DeployBucket

  DeployEngineFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/deploy_engine/
      Handler: app.lambda_handler
      Policies:
                - S3CrudPolicy:
            BucketName: !Ref DeployBucket
                - DynamoDBCrudPolicy:
            TableName: !Ref DeploymentTable
                - SNSPublishMessagePolicy:
            TopicName: !GetAtt NotifyTopic.TopicName

  NotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/notifier/
      Handler: app.lambda_handler
      Policies:
                - SNSPublishMessagePolicy:
            TopicName: !GetAtt NotifyTopic.TopicName

Outputs:
  ApiEndpoint:
    Value: !Sub https://${ServerlessRestApi}.execute-api.${【entity-AWS¦canonical_name=AWS】::Region}.amazonaws.com/Prod/webhook
  DeployBucketName:
    Value: !Ref DeployBucket
  WebsiteURL:
    Value: !Sub http://${DeployBucket}.s3-website-${AWS::Region}.amazonaws.com